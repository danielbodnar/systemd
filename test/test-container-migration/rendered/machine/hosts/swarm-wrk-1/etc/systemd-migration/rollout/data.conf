# Rendered by systemd-migration: rollout specification of stack data on swarm-wrk-1.
# Read by /usr/local/lib/systemd-migration/stackctl; see the systemd-rollout skill's references/rollout-spec.md.
# The sections are in rollout order: deploy and activate walk them from the
# top, drain walks them from the bottom. Reordering the sections reorders the
# walk; nothing else in the file depends on their order.

[Rollout]
Stack=data
Host=swarm-wrk-1
Monitor=30s
StateDirectory=/var/lib/systemd-migration/rollout
CredentialScript=/usr/local/lib/systemd-migration/import-credentials.sh
ConfigForm=files

[Service data_exporter]
Units=data_exporter.service
Health=
Sockets=
Credentials=data_postgres_password
Configs=
Parallelism=1
Delay=0s
Order=stop-first
FailureAction=pause
Monitor=30s
MaxFailureRatio=0
Image=/var/lib/machines/prometheuscommunity-postgres-exporter_v0.15.0.mstack
Form=service

[Service data_postgres]
Units=data_postgres.service
Health=data_postgres-health.service
Sockets=
Credentials=data_postgres_password
Configs=
Parallelism=1
Delay=0s
Order=stop-first
FailureAction=pause
Monitor=5s
MaxFailureRatio=0
Image=/var/lib/machines/library-postgres_16.4.mstack
Form=service
