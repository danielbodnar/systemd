  - id: networkd.publish.web_app.8080-tcp
    component: networkd
    kind: choice
    subject: 
      kind: port
      name: web_app:8080/tcp
    question: Port 8080/tcp of web_app was published in ingress mode through the routing mesh. How do clients reach it now?
    options: 
      - value: host
        label: on each host that runs it
        consequence: "the service binds the port on its host; SocketBindAllow= restricts it to that port; clients use the host's address"
      - value: socket
        label: socket activation
        consequence: a .socket unit owns the port and passes it in; the process must accept an inherited socket
        requires: 
          systemd: 250
      - value: external-lb
        label: behind an external load balancer
        consequence: "same as host, and the plan lists the hosts as backends for the balancer you operate"
      - value: dns-rr
        label: DNS round robin
        consequence: "same as host, plus one resolved/dnssd record per host announcing the port"
    evidence: 
      - "services[web_app].ports[8080] mode=ingress published=8080"
    default: null
    chosen: host
