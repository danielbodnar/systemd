    kind: choice
    subject: 
      kind: estate
      name: estate
    question: "Append SELinux relabel suffixes (:z shared, :Z private) to bind mounts and config mounts in the Quadlet containers?"
    options: 
      - value: "no"
        label: no relabeling
        consequence: "mounts keep their labels; needed on hosts without SELinux, and where the paths are already labeled container_file_t"
      - value: "yes"
        label: relabel bind mounts
        consequence: "bind mounts get ,Z (read-write) or ,z (read-only) and config mounts ,z so the container can read them under an enforcing policy"
    evidence: 
