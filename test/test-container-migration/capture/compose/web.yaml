# Compose file the fixture estate's "web" stack was deployed from. The
# capture records what the swarm reports; this file is here for the
# depends_on and profile information that the API does not expose.
services:
  proxy:
    image: docker.io/library/caddy:2
    deploy:
      mode: global
      placement:
        constraints: ["node.labels.tier == edge"]
    ports:
      - target: 80
        published: 80
        mode: host
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    cap_add: [NET_BIND_SERVICE]
    networks:
      frontend:
        aliases: [proxy]
    depends_on:
      app:
        condition: service_healthy
  app:
    image: registry.example.com/acme/app:2026.09
    command: ["serve", "--port", "8080"]
    user: "1000:1000"
    working_dir: /srv/app
    init: true
    read_only: true
    deploy:
      replicas: 2
      placement:
        constraints: ["node.role == worker"]
        max_replicas_per_node: 1
      resources:
        limits: { cpus: "1.5", memory: 512M, pids: 512 }
        reservations: { memory: 128M }
      restart_policy: { condition: on-failure, delay: 3s, max_attempts: 5, window: 120s }
      update_config: { parallelism: 1, delay: 10s, failure_action: rollback, monitor: 30s, order: start-first }
    ports:
      - target: 8080
        published: 8080
        mode: ingress
    environment:
      DATABASE_URL: postgres://app@data_postgres:5432/app
      LOG_LEVEL: info
    env_file: [app.env]
    extra_hosts: ["legacy.internal:10.0.9.9"]
    tmpfs: ["/tmp:size=64m"]
    volumes:
      - cache:/cache
    secrets:
      - source: signing_key
        target: signing_key
        uid: "1000"
        gid: "1000"
        mode: 0400
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    ulimits:
      nofile: 65536
    sysctls:
      net.core.somaxconn: 1024
    cap_drop: [ALL]
    networks:
      frontend:
        aliases: [app]
networks:
  frontend:
    driver: overlay
    driver_opts: { encrypted: "" }
    ipam:
      config: [{ subnet: 10.10.1.0/24, gateway: 10.10.1.1 }]
volumes:
  cache: {}
configs:
  caddyfile:
    file: ./Caddyfile
secrets:
  signing_key:
    external: true
    name: web_app_signing_key
