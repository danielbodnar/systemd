# systemd-sysusers(8) fragment: the two unprivileged accounts of the harness.
# swarm-agent holds the environment key and talks to Anthropic; swarm-agent-tools
# executes the agents' tools and holds nothing. They share the swarm-agent group
# for the workspace, and the swarm-agent-ipc group, which has no other member,
# is the only way onto the executor's socket and its token file.
u swarm-agent - "swarm-agent Managed Agents worker" /var/lib/swarm-agent
u swarm-agent-tools - "swarm-agent tool executor" /var/lib/swarm-agent/workspace
g swarm-agent-ipc -
m swarm-agent-tools swarm-agent
m swarm-agent swarm-agent-ipc
m swarm-agent-tools swarm-agent-ipc
