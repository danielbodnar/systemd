#
# The EFI system partition of a bootable DDI for systemd-vmspawn. make-vm-ddi.sh
# stages the operator's UKI (or EFI-stub kernel) under esp/ in its copy source:
# once at the removable-media fallback path the firmware boots without a boot
# loader (EFI/BOOT/BOOT<ARCH>.EFI), once under EFI/Linux/ as a Boot Loader
# Specification type #2 entry for systemd-boot or systemd-vmspawn's own search.
[Partition]
Type=esp
Format=vfat
CopyFiles=/esp:/
SizeMinBytes=256M
SizeMaxBytes=256M
