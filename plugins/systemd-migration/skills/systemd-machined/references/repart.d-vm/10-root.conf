#
# The read-only root of a bootable DDI: the merged mount stack, which
# make-vm-ddi.sh mounts under root/ in its copy source, plus the kernel module
# tree the operator supplied. A guest that needs to write boots with
# systemd.volatile=overlay on the UKI's command line.
[Partition]
Type=root
Format=erofs
CopyFiles=/root:/
Minimize=best
